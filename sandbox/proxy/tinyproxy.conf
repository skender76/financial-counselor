# Configurazione statica del proxy d'uscita (ITEM-005). Il file di filtro
# (l'allowlist effettiva, con l'eventuale aggiunta di --allow-pip) non è qui:
# sandbox.sh lo genera e lo monta in sola lettura a /etc/tinyproxy/filter
# prima di avviare questo container, quindi il proxy non parte mai senza.
Port 8888
Listen 0.0.0.0
Timeout 600
DisableViaHeader Yes
LogFile "/dev/stdout"
LogLevel Info
PidFile "/tmp/tinyproxy.pid"
MaxClients 20

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No
